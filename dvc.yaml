stages:
  build_vocab:
    cmd: python src/dataset/build_voca.py
    deps:
      - data/annotations/annotation.json
      - src/dataset/build_voca.py
    params:
      - tokenizer.min_freq
      - tokenizer.max_vocab_size
      - tokenizer.special_tokens
    outs:
      - outputs/tokenizer/vocab.json

  extract_cnn_features:
    cmd: python scripts/extract_cnn_features.py
    deps:
      - data/raw
      - data/annotations/annotation.json
      - scripts/extract_cnn_features.py
      - src
    params:
      - data
      - transform
      - cnn
    outs:
      - data/processed/features

  train_lstm:
    cmd: python src/engines/classification_trainer.py --params params.yaml --model lstm
    deps:
      - data/raw
      - data/annotations/annotation.json
      - outputs/tokenizer/vocab.json
      - src
    params:
      - data
      - tokenizer.vocab_path
      - preprocess
      - cnn
      - train
      - models.lstm
    outs:
      - outputs/lstm_checkpoints.json
    metrics:
      - outputs/metrics/lstm_train_metrics.json:
          cache: false

  train_gru:
    cmd: python src/engines/classification_trainer.py --params params.yaml --model gru
    deps:
      - data/processed/images
      - data/processed/manifest/train.json
      - data/processed/manifest/val.json
      - outputs/tokenizer/vocab.json
      - configs/captioning/gru.yaml
      - scripts/train_captioning.py
      - src
    params:
      - train.epochs
      - train.batch_size
      - train.seed
    outs:
      - outputs/captioning/gru/checkpoints
    metrics:
      - outputs/captioning/gru/metrics/train_metrics.json:
          cache: false

  train_transformer:
    cmd: python src/engines/classification_trainer.py --params params.yaml --model transformer
    deps:
      - data/processed/images
      - data/processed/manifest/train.json
      - data/processed/manifest/val.json
      - outputs/tokenizer/vocab.json
      - configs/captioning/transformer.yaml
      - scripts/train_captioning.py
      - src
    params:
      - train.epochs
      - train.batch_size
      - train.seed
    outs:
      - outputs/captioning/transformer/checkpoints
    metrics:
      - outputs/captioning/transformer/metrics/train_metrics.json:
          cache: false