project:
  name: imagenet-project

data:
  raw_dir: /workspace/data/raw/
  captions_file: /workspace/data/annotations/annotation.json
  dataset_version: raw-20260509-v1

tokenizer:
  min_freq: 5
  max_vocab_size: 10000

split:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15

train:
  seed: 42
  # repeated experiment
  # seed: 7
  # seed: 21
  epochs: 20
  batch_size: 32
  num_workers: 4
  device: cuda
  optimizer: adam

preprocess:
  image_size: 224
  normalize: true

loss:
  name: cross_entropy
  ignore_index: pad_token

evaluate:
  batch_size: 32
  metrics:
    - bleu
    - rouge_l
    - meteor

logging:
  use_wandb: true
  project_name: imagenet-project
  log_interval: 10

outputs:
  base_dir: outputs

cnn:
  backbone: resnet18
  pretrained: true
  freeze: true
  output_dim: 512
  dropout: 0.3
  pooling: avg

captioning:

  encoder: resnet18
  decoder: transformer # lstm | gru | transformer
  version: epochs50

  epochs: 50
  learning_rate: 0.0001
  batch_size: 32
  optimizer: adam

  max_caption_length: 30

  lstm:
    embed_dim: 256
    hidden_dim: 512
    num_layers: 1  

  gru:
    embed_dim: 256
    hidden_dim: 512
    num_layers: 1

  transformer:
    d_model: 512
    nhead: 8
    num_layers: 4
    dropout: 0.3
    weight_decay: 0.0

  checkpoint:
    save_dir: /workspace/outputs/captioning


classification:

  model_name: resnet18
  # model_name: efficientnet_b0
  # model_name: convnext_tiny
  # model_name: mobilenet_v3_small
  # model_name: vit_b_16
  # model_name: swin_t
  # model_name: deit_tiny_patch16_224

  epochs: 50

  learning_rate:

    # baseline
    cnn: 0.001
    transformer: 0.0005

    # hyperparameter tuning
    # cnn: 0.0005
    # transformer: 0.0001

  optimizer: adam

  # optimizer: sgd
  # optimizer: adamw

  scheduler:
    use: false

    # use: true
    # name: cosineannealinglr

  augmentation:

    # baseline
    use_aug: false
    type: none

    # mixup
    # use_aug: true
    # type: mixup

    # cutmix
    # use_aug: true
    # type: cutmix

  metrics:

    train:
      - loss
      - accuracy

    validation:
      - loss
      - accuracy
      - macro_f1

    final_test:
      - accuracy
      - macro_f1
      - precision
      - recall
      - confusion_matrix

  checkpoint:
    save_dir: /workspace/outputs/classification