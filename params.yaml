project:
  name: imagenet-project

data:
  raw_dir: /workspace/data/raw/
  captions_file: /workspace/data/captioning/annotations/train.json
  dataset_version: cls_raw-20260525-v2
  # dataset_version: raw-20260509-v1

split:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15

train:
  seed: 42
  # repeated experiment
  # seed: 7
  # seed: 21
  epochs: 20
  batch_size: 32
  num_workers: 4
  device: cuda
  optimizer: adam

preprocess:
  image_size: 224
  normalize: true

loss:
  name: cross_entropy
  ignore_index: pad_token

evaluate:
  batch_size: 32
  metrics:
    - bleu
    - rouge_l
    - meteor

logging:
  use_wandb: true
  project_name: imagenet-project
  log_interval: 10

outputs:
  base_dir: outputs

cnn:
  backbone: resnet18
  pretrained: true
  freeze: true
  output_dim: 512
  dropout: 0.3
  pooling: avg

captioning:

  encoder: resnet18
  # encoder: swin
  # encoder: vit
  decoder: transformer
  # decoder: lstm
  # decoder: gru
  version: encoder_test

  epochs: 5
  learning_rate: 0.0001
  batch_size: 32
  optimizer: adam
  max_caption_length: 30
  train_num_caption: 2

  debug: Ture

  lstm:
    embed_dim: 256
    hidden_dim: 512
    num_layers: 1

  gru:
    embed_dim: 256
    hidden_dim: 512
    num_layers: 1

  transformer:
    n_layers: 4
    nhead: 8
    d_model: 512
    drop_p: 0.1
    label_smoothing: 0
    # weight_decay: 0.001

  data:
    dataset_version: cap_raw-20260524-v1
    train_img: /workspace/data/captioning/raw/train/
    train_caption: /workspace/data/captioning/annotations/train.json
    val_img: /workspace/data/captioning/raw/val/
    val_caption: /workspace/data/captioning/annotations/val.json
    test_img: /workspace/data/captioning/raw/test/
    test_caption: /workspace/data/captioning/annotations/test.json
    
  tokenizer:
    min_freq: 3
    max_vocab_size: 10000
    sp_vocab_size: 1000
    use_subword: Ture
    sp_model_path: /workspace/src/dataset/sub_tokenizer.model

  checkpoint:
    save_dir: /workspace/outputs/captioning
    resume: False

  heatmap:
    dec_atten_dir: /workspace/outputs/captioning/heatmap/
    enc_dec_atten_dir: /workspace/outputs/captioning/heatmap/
    layer: 4 # 몇번째 층
    n_sample: 0 # 몇번째 샘플(batch)


    


classification:

  # model_name: resnet18
  # model_name: efficientnet_b0
  # model_name: convnext_tiny
  # model_name: mobilenet_v3_small
  # model_name: vit_b_16
  model_name: swin_t
  # model_name: deit_tiny_patch16_224

  epochs: 50

  learning_rate:

    # baseline
    cnn: 0.001
    transformer: 0.0005

    # hyperparameter tuning
    # cnn: 0.0005
    # transformer: 0.0001

  # optimizer: adam
  # optimizer: sgd
  optimizer: adamw

  # default
  # weight_decay: 0.01

  # tuning
  weight_decay: 0.05

  scheduler:
    use: false

    # use: true
    # name: cosineannealinglr

  augmentation:

    # baseline
    use_aug: false
    type: none

    # mixup
    # use_aug: true
    # type: mixup

    # cutmix
    # use_aug: true
    # type: cutmix

  metrics:

    train:
      - loss
      - accuracy

    validation:
      - loss
      - accuracy
      - macro_f1

    final_test:
      - accuracy
      - macro_f1
      - precision
      - recall
      - confusion_matrix

  checkpoint:
    save_dir: /workspace/outputs/classification