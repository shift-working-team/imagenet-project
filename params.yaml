project:
  name: imagenet-project

data:
  raw_dir: /workspace/data/raw/
  captions_file: /workspace/data/annotations/annotation.json

tokenizer:
  min_freq: 5
  max_vocab_size: 10000

split:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15

train:
  seed: 42
  epochs: 20
  batch_size: 32
  num_workers: 4
  device: cuda
  optimizer: adam

preprocess:
  image_size: 224
  normalize: true
  max_caption_length: 30

loss:
  name: cross_entropy
  ignore_index: pad_token

evaluate:
  batch_size: 32
  metrics:
    - bleu
    - rouge_l
    - meteor

logging:
  use_wandb: true
  project_name: imagenet-project
  log_interval: 10

outputs:
  base_dir: outputs

cnn:
  backbone: resnet18
  pretrained: true
  freeze: true
  output_dim: 512
  dropout: 0.3
  pooling: avg

model:
  lstm:
    embed_dim: 256
    hidden_dim: 512
    num_layers: 1
    dropout: 0.3
    bidirectional: false
    optimizer: adam
    learning_rate: 0.001
    weight_decay: 0.0

  gru:
    embed_dim: 256
    hidden_dim: 512
    num_layers: 1
    dropout: 0.3
    bidirectional: false
    optimizer: adam
    learning_rate: 0.001
    weight_decay: 0.0

  transformer:
    embed_dim: 256
    hidden_dim: 512
    num_layers: 1
    dropout: 0.3
    bidirectional: false
    optimizer: adam
    learning_rate: 0.001
    weight_decay: 0.0

classification:

  model_name: resnet18

  epochs: 50

  learning_rate: 0.001

  augmentation:
    use_aug: false
    type: none

  metrics:
    train:
      - loss
      - accuracy

    validation:
      - loss
      - accuracy
      - macro_f1

  checkpoint:
    save_dir: /workspace/checkpoints